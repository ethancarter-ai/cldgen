[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cldgen"
version = "0.1.0"
description = "Generate Markdown changelogs from Git log tags and body notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["changelog", "git", "cli", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
  "arrow>=1.3",
]
urls = { Repository = "https://github.com/ethancarter-ai/cldgen" }

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.6",
]

[project.scripts]
cldgen = "cldgen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cldgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
